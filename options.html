<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资料库管理 · 报价自动填写助手</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>资料库管理</h1>
      <div class="safe">所有信息只保存在本机浏览器中 · 不联网 · 不上传任何服务器</div>
    </div>
  </header>

  <section class="tpl-bar">
    <label>当前资料库：</label>
    <select id="tplSelect"></select>
    <button id="renameBtn" class="btn btn-ghost btn-sm">重命名</button>
    <button id="newTplBtn" class="btn btn-ghost btn-sm">新建资料库</button>
    <button id="dupTplBtn" class="btn btn-ghost btn-sm">复制一份</button>
    <button id="delTplBtn" class="btn btn-danger btn-sm">删除此资料库</button>
  </section>

  <div id="msg" class="msg"></div>

  <section class="entries-head">
    <h2>信息条目 <span id="entryCount" class="count"></span></h2>
    <button id="addEntryBtn" class="btn btn-primary btn-sm">+ 新增一条信息</button>
  </section>

  <div id="entries" class="entries"></div>

  <section class="io">
    <button id="exportBtn" class="btn btn-ghost btn-sm">导出全部备份</button>
    <button id="importBtn" class="btn btn-ghost btn-sm">导入备份</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <span class="io-note">换电脑时用「导出/导入」迁移你的全部资料库</span>
  </section>
</div>

<template id="entryTpl">
  <div class="entry">
    <div class="entry-head">
      <input type="text" class="e-label" placeholder="信息名称（如：姓名 / 公司名称 / 出生日期）">
      <button class="btn btn-danger btn-xs e-del">删除此条</button>
    </div>
    <div class="e-row">
      <div class="e-col">
        <div class="e-caption">识别词（网页上出现这些字眼就会匹配到本条，用逗号分隔）</div>
        <input type="text" class="e-keywords" placeholder="如：姓名,名字,联系人,name">
      </div>
    </div>
    <div class="e-caption">内容格式（同一信息可存多种写法，填表时自动挑合适的；点★设为默认）</div>
    <div class="formats"></div>
    <button class="btn btn-ghost btn-xs add-format">+ 增加一种格式</button>
  </div>
</template>

<template id="formatTpl">
  <div class="format-row">
    <button class="star" title="设为默认格式">☆</button>
    <input type="text" class="f-value" placeholder="内容（如：1990-01-01）">
    <input type="text" class="f-note" placeholder="格式说明（可留空，如：年-月-日）">
    <button class="btn btn-danger btn-xs f-del">删</button>
  </div>
</template>

<script src="defaults.js"></script>
<script src="store.js"></script>
<script src="options.js"></script>
</body>
</html>
